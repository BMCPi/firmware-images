name: Build and Release U-Boot Raspberry Pi Image

on:
  workflow_dispatch:
    inputs:
      uboot:
        description: "U-Boot version tag to build"
        required: false
        type: string
      edk2:
        description: "EDK2 stable tag (e.g. edk2-stable202502)"
        required: false
        type: string
      edk2_platforms:
        description: "EDK2 Platforms stable tag (e.g. edk2-platforms-stable202502)"
        required: false
        type: string
      optee:
        description: "OP-TEE OS version tag (e.g. 4.5.0)"
        required: false
        type: string
      tfa:
        description: "TF-A commit/tag for the rpi5 OP-TEE armstub (patch base)"
        required: false
        type: string
      firmware:
        description: "Raspberry Pi firmware version"
        required: false
        type: string
      linux:
        description: "raspberrypi/linux branch or tag (e.g. rpi-6.18.y)"
        required: false
        type: string
      kernel:
        description: "Talos kernel OCI image version tag (e.g. v1.10.0)"
        required: false
        type: string
  push:
    paths:
      - 'u-boot/**'

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      uboot: ${{ steps.version.outputs.uboot }}
      edk2: ${{ steps.version.outputs.edk2 }}
      edk2_platforms: ${{ steps.version.outputs.edk2_platforms }}
      optee: ${{ steps.version.outputs.optee }}
      tfa: ${{ steps.version.outputs.tfa }}
      firmware: ${{ steps.version.outputs.firmware }}
      linux: ${{ steps.version.outputs.linux }}
      talos_kernel: ${{ steps.version.outputs.talos_kernel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Read versions from file
        id: version
        run: |
          VERSION_FILE="u-boot/version"

          # Parse values from version file
          FILE_UBOOT_VER=$(grep '^uboot ' "$VERSION_FILE" | awk '{print $2}')
          FILE_EDK2_VER=$(grep '^edk2 ' "$VERSION_FILE" | awk '{print $2}')
          FILE_EDK2_PLATFORMS_VER=$(grep '^edk2-platforms ' "$VERSION_FILE" | awk '{print $2}')
          FILE_OPTEE_VER=$(grep '^optee ' "$VERSION_FILE" | awk '{print $2}')
          FILE_TFA_VER=$(grep '^tfa ' "$VERSION_FILE" | awk '{print $2}')
          FILE_FIRMWARE_VER=$(grep '^firmware ' "$VERSION_FILE" | awk '{print $2}')
          FILE_LINUX_VER=$(grep '^linux ' "$VERSION_FILE" | awk '{print $2}')
          FILE_TALOS_KERNEL_VER=$(grep '^talos_kernel ' "$VERSION_FILE" | awk '{print $2}')

          # Use workflow_dispatch inputs if provided, otherwise use file values
          uboot="${{ inputs.uboot }}"
          uboot="${uboot:-$FILE_UBOOT_VER}"

          edk2="${{ inputs.edk2 }}"
          edk2="${edk2:-$FILE_EDK2_VER}"

          edk2_platforms="${{ inputs.edk2_platforms }}"
          edk2_platforms="${edk2_platforms:-$FILE_EDK2_PLATFORMS_VER}"

          optee="${{ inputs.optee }}"
          optee="${optee:-$FILE_OPTEE_VER}"

          tfa="${{ inputs.tfa }}"
          tfa="${tfa:-$FILE_TFA_VER}"

          firmware="${{ inputs.firmware }}"
          firmware="${firmware:-$FILE_FIRMWARE_VER}"

          linux="${{ inputs.linux }}"
          linux="${linux:-$FILE_LINUX_VER}"

          talos_kernel="${{ inputs.kernel }}"
          talos_kernel="${talos_kernel:-$FILE_TALOS_KERNEL_VER}"

          release="u-boot-${uboot}"

          echo "uboot=$uboot" >> $GITHUB_OUTPUT
          echo "edk2=$edk2" >> $GITHUB_OUTPUT
          echo "edk2_platforms=$edk2_platforms" >> $GITHUB_OUTPUT
          echo "optee=$optee" >> $GITHUB_OUTPUT
          echo "tfa=$tfa" >> $GITHUB_OUTPUT
          echo "firmware=$firmware" >> $GITHUB_OUTPUT
          echo "linux=$linux" >> $GITHUB_OUTPUT
          echo "talos_kernel=$talos_kernel" >> $GITHUB_OUTPUT
          echo "release=$release" >> $GITHUB_OUTPUT
          echo "Release version: $release"

  build-uboot:
    needs: determine-version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          path: src
          ref: ${{ github.ref }}

      - name: Checkout u-boot
        uses: actions/checkout@v4
        with:
          repository: u-boot/u-boot
          fetch-depth: 1
          path: u-boot
          ref: ${{ needs.determine-version.outputs.uboot }}

      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential git bison flex bc libssl-dev libgnutls28-dev device-tree-compiler
          version: 1.0

      - name: Configure U-Boot for Raspberry Pi 4 ARM64
        working-directory: u-boot
        run: |
          patch -p1 < ${{ github.workspace }}/src/u-boot/patches/rpi_arm64_defconfig.patch

          make LOCALVERSION_AUTO=n LOCALVERSION= rpi_arm64_defconfig

      - name: Build U-Boot
        working-directory: u-boot
        run: |
          make LOCALVERSION_AUTO=n LOCALVERSION= -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto"
          ls -la u-boot.bin

      - name: Upload U-Boot binary
        uses: actions/upload-artifact@v4
        with:
          name: uboot-binary
          path: u-boot/u-boot.bin
          retention-days: 1
          if-no-files-found: error

  build-edk2:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCC_AARCH64_PREFIX: aarch64-linux-gnu-

    steps:
      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: acpica-tools gcc-aarch64-linux-gnu uuid-dev
          version: 1.4

      - name: Cache EDK2 source and BaseTools
        id: cache-edk2
        uses: actions/cache@v4
        with:
          # Whole edk2 tree: source + required submodules + built BaseTools
          # (make -C edk2/BaseTools writes into this dir) + generated Conf/.
          # BaseTools binaries are host-specific, so key on runner os/arch.
          path: edk2
          key: edk2-${{ runner.os }}-${{ runner.arch }}-${{ needs.determine-version.outputs.edk2 }}-v4

      - name: Checkout EDK2
        if: steps.cache-edk2.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          fetch-depth: 1
          path: edk2
          ref: ${{ needs.determine-version.outputs.edk2 }}
          submodules: false

      - name: Fetch required EDK2 submodules
        if: steps.cache-edk2.outputs.cache-hit != 'true'
        working-directory: edk2
        run: |
          # EDK2 validates [Includes] paths in every parsed .dec up front, so the
          # submodule dirs they reference must exist even if barely used. The DSC
          # pulls modules from MdePkg, MdeModulePkg, CryptoPkg and SecurityPkg, so
          # their submodule include dirs are all required:
          #   MdePkg.dec       -> mipisyst
          #   MdeModulePkg.dec -> brotli      (also compiled by BaseTools)
          #   CryptoPkg.dec    -> openssl + mbedtls
          #   SecurityPkg.dec  -> libspdm
          # The DSC does not reference RedfishPkg, so jansson is not needed. The
          # remaining submodules (googletest, oniguruma, libfdt, cmocka, subhook,
          # TPM) are not referenced either, which still cuts most of the clone time.
          git submodule update --init --depth 1 \
            CryptoPkg/Library/MbedTlsLib/mbedtls \
            CryptoPkg/Library/OpensslLib/openssl \
            MdePkg/Library/MipiSysTLib/mipisyst \
            MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
            BaseTools/Source/C/BrotliCompress/brotli \
            SecurityPkg/DeviceSecurity/SpdmLib/libspdm

      - name: Checkout edk2-platforms
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2-platforms
          path: edk2-platforms
          ref: ${{ needs.determine-version.outputs.edk2_platforms }}
          fetch-depth: 1

      - name: Set up EDK2
        if: steps.cache-edk2.outputs.cache-hit != 'true'
        run: make -C edk2/BaseTools

      - name: Build EDK2 StandaloneMM
        env:
          GCC_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          export WORKSPACE=$(pwd)
          export PACKAGES_PATH=$WORKSPACE/edk2:$WORKSPACE/edk2-platforms
          export ACTIVE_PLATFORM="edk2-platforms/Platform/StandaloneMm/PlatformStandaloneMmPkg/PlatformStandaloneMmRpmb.dsc"
          source edk2/edksetup.sh

          # mbedtls's aarch64 inline asm in constant_time.c is rejected by GCC when
          # inlined under EDK2's codegen flags (fails with or without LTO, in every
          # mbedtls 3.5-3.6). Disabling MBEDTLS_HAVE_ASM makes mbedtls use its C
          # fallback (still constant-time) and is the actual fix for the asm error.
          # MBEDTLS_AESCE_C must go too: with the asm path off, aes.c still calls the
          # ARMv8 AES-extension helpers in aesce.c, leaving them undefined at link.
          sed -i -E 's@^#define (MBEDTLS_HAVE_ASM|MBEDTLS_AESCE_C)\>@// & disabled for EDK2 aarch64 build@' \
            edk2/CryptoPkg/Library/MbedTlsLib/Include/mbedtls/mbedtls_config.h

          # Drop -flto: belt-and-suspenders for the above, keeps RELEASE + -Os.
          sed -i 's/ -flto//g' edk2/Conf/tools_def.txt

          # edk2-stable202602 predates the GCC 13/14 cross-compiler used here, which
          # emits new (often false-positive) warnings like -Wmaybe-uninitialized.
          # Drop -Werror so those don't fail the build of this third-party tree.
          sed -i 's/ -Werror//g' edk2/Conf/tools_def.txt

          build -p $ACTIVE_PLATFORM -b RELEASE -a AARCH64 -t GCC -n $(nproc)

      - name: Upload StandaloneMM firmware
        uses: actions/upload-artifact@v4
        with:
          name: edk2-stmm
          path: Build/MmStandaloneRpmb/RELEASE_GCC/FV/BL32_AP_MM.fd
          retention-days: 1
          if-no-files-found: error

  build-optee:
    needs: [determine-version, build-edk2]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential gcc-arm-linux-gnueabihf python3-pyelftools python3-cryptography libssl-dev device-tree-compiler bc patch
          version: 2.1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          path: src

      - name: Checkout OP-TEE OS
        uses: actions/checkout@v4
        with:
          repository: OP-TEE/optee_os
          fetch-depth: 1
          path: optee_os
          ref: ${{ needs.determine-version.outputs.optee }}

      - name: Checkout TF-A
        uses: actions/checkout@v4
        with:
          repository: ARM-software/arm-trusted-firmware
          fetch-depth: 1
          path: arm-trusted-firmware
          ref: ${{ needs.determine-version.outputs.tfa }}

      - name: Download StandaloneMM firmware
        uses: actions/download-artifact@v4
        with:
          name: edk2-stmm
          path: optee_os

      # --- Raspberry Pi 5 (BCM2712): TF-A BL31 + OP-TEE BL32, concatenated ---
      # OP-TEE is BL32, not an armstub. It must be linked to run at TF-A's
      # BL32_BASE and handed off by BL31. The TF-A patch (armtfw.patch) wires
      # SPD=opteed for rpi5, copies the appended OP-TEE image from
      # RPI_OPTEE_IMAGE_BASE (0x20000) to BL32_BASE (0x10100000) and jumps to it.
      - name: Build OP-TEE for Raspberry Pi 5
        working-directory: optee_os
        run: |
          export ARCH=arm
          # plat-rpi5 is already merged in 4.10.0; this patch only raises
          # DRAM0_SIZE 8GB->16GB so OP-TEE sees all DRAM on 16GB boards.
          patch -p1 --fuzz=3 < "${{ github.workspace }}/src/u-boot/patches/optee_os.patch"
          # CFG_TZDRAM_START must match TF-A BL32_BASE from armtfw.patch.
          CROSS_COMPILE32=arm-linux-gnueabihf- make -j$(nproc) CFG_ARM64_core=y \
            PLATFORM=rpi5 CFG_TZDRAM_START=0x10100000 \
            CFG_USER_TA_TARGETS=ta_arm64 \
            CFG_CORE_ASLR=n \
            CFG_STMM_PATH=BL32_AP_MM.fd CFG_RPMB_FS=y \
            CFG_RPMB_FS_DEV_ID=0 CFG_CORE_HEAP_SIZE=524288 CFG_RPMB_WRITE_KEY=y \
            CFG_CORE_DYN_SHM=y CFG_RPMB_TESTKEY=y CFG_REE_FS=n \
            CFG_TEE_CORE_LOG_LEVEL=4 \
            CFG_TEE_TA_LOG_LEVEL=1 CFG_SCTLR_ALIGNMENT_CHECK=n
          ls -la out/arm-plat-rpi5/core/tee-raw.bin

      - name: Patch and build TF-A for Raspberry Pi 5 (SPD=opteed)
        working-directory: arm-trusted-firmware
        run: |
          # armtfw.patch is regenerated for TF-A v2.15.0 (applies with zero fuzz);
          # --fuzz=3 leaves slack for minor drift if the tfa pin is bumped.
          patch -p1 --fuzz=3 < "${{ github.workspace }}/src/u-boot/patches/armtfw.patch"
          make -j$(nproc) PLAT=rpi5 SPD=opteed RPI3_RUNTIME_UART=1 DEBUG=1
          ls -la build/rpi5/debug/bl31.bin

      - name: Assemble armstub8-2712.bin (BL31 + OP-TEE)
        run: |
          cp arm-trusted-firmware/build/rpi5/debug/bl31.bin armstub8-2712.bin
          # OP-TEE goes at RPI_OPTEE_IMAGE_BASE = 0x20000 = 128 KiB (bs=1024 seek=128).
          dd if=optee_os/out/arm-plat-rpi5/core/tee-raw.bin of=armstub8-2712.bin \
            bs=1024 seek=128 conv=notrunc
          ls -la armstub8-2712.bin

      # --- Raspberry Pi 4 (BCM2711): plain TF-A BL31 ---
      # Mainline TF-A rpi4 has no OP-TEE/BL32 support, so this armstub is the
      # EL3 monitor only (the patch is inert without SPD=opteed). No fTPM on rpi4.
      - name: Build TF-A for Raspberry Pi 4 (armstub8.bin)
        working-directory: arm-trusted-firmware
        run: |
          make -j$(nproc) PLAT=rpi4 DEBUG=1
          cp build/rpi4/debug/bl31.bin ../armstub8.bin
          ls -la ../armstub8.bin

      - name: Upload armstub binaries
        uses: actions/upload-artifact@v4
        with:
          name: optee-binaries
          path: |
            armstub8.bin
            armstub8-2712.bin
          retention-days: 1
          if-no-files-found: error

  checkout-firmware:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Cache Raspberry Pi firmware
        id: cache-rpi-firmware
        uses: actions/cache@v4
        with:
          path: firmware
          key: rpi-firmware-${{ needs.determine-version.outputs.firmware }}

      - name: Checkout Raspberry Pi firmware
        if: steps.cache-rpi-firmware.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/firmware
          fetch-depth: 1
          path: firmware
          ref: ${{ needs.determine-version.outputs.firmware }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rpi-firmware
          path: |
            firmware/boot/*.elf
            firmware/boot/*.dat
            firmware/boot/*.bin
            firmware/boot/overlays
          retention-days: 1
          if-no-files-found: error

  prepare-config:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Upload config.txt
        uses: actions/upload-artifact@v4
        with:
          name: config-files
          path: u-boot/config.txt
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  build-kernel-dtbos:
    needs: determine-version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: src

      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential cpp device-tree-compiler
          version: 1.0

      - name: Checkout rpi kernel
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: raspberrypi/linux
          fetch-depth: 1
          path: firmware
          ref: ${{ needs.determine-version.outputs.linux }}

      - name: Download and patch Raspberry Pi kernel source
        working-directory: firmware
        run: |
          for patch in $(find ${{ github.workspace }}/src/u-boot/patches/dtb -type f -name '*.patch' | sort); do
            echo "Applying patch $patch"
            patch -p1 < "$patch" || (echo "Failed to apply patch $patch" && exit 1)
          done

          # Copy custom overlay DTS files into the kernel source tree
          mkdir -p arch/arm/boot/dts/overlays/
          cp -av ${{ github.workspace }}/src/u-boot/patches/dtb/overlays/* arch/arm/boot/dts/overlays/

      - name: Build overlay device tree binaries
        working-directory: firmware
        run: |
          mkdir -p out/overlays

          export DTC_FLAGS="-R 0 -p 0 -@ -H epapr"
          for dts in arch/arm/boot/dts/overlays/*.dts; do
            # disable-v3d-overlay.dts -> disable-v3d
            target=$(basename "${dts%*.dts}")
            target="${target%-overlay}"
            echo "Building $target.dtbo"
            cpp -nostdinc -I include -I arch -undef -x assembler-with-cpp \
              -I scripts/dtc/include-prefixes/ -D__DTS__ -DFIRMWARE_UPDATED \
              -P "$dts" -o "out/overlays/$target.dts"
            dtc -O dtb $DTC_FLAGS -o "out/overlays/$target.dtbo" "out/overlays/$target.dts"
          done

          # Match the names firmware wants
          [ -f out/overlays/hat_map.dtbo ] && mv out/overlays/hat_map.dtbo out/overlays/hat_map.dtb
          [ -f out/overlays/overlay_map.dtbo ] && mv out/overlays/overlay_map.dtbo out/overlays/overlay_map.dtb

          echo "Built overlay files:"
          ls -lah out/overlays/

      - name: Upload kernel overlay files
        uses: actions/upload-artifact@v4
        with:
          name: kernel-overlays
          path: firmware/out/overlays/
          retention-days: 1
          if-no-files-found: error

  extract-kernel-dtbs:
    needs: determine-version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read

    steps:
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Cache kernel DTBs
        id: cache-kernel-dtbs
        uses: actions/cache@v4
        with:
          path: out
          key: talos-dtbs-${{ needs.determine-version.outputs.talos_kernel }}

      - name: Extract DTBs from Talos kernel OCI image
        if: steps.cache-kernel-dtbs.outputs.cache-hit != 'true'
        run: |
          mkdir -p out

          echo "Extracting DTBs from ghcr.io/siderolabs/kernel:${{ needs.determine-version.outputs.talos_kernel }}..."
          crane export --platform linux/arm64 \
            ghcr.io/siderolabs/kernel:${{ needs.determine-version.outputs.talos_kernel }} \
            /tmp/talos-kernel.tar

          tar -xf /tmp/talos-kernel.tar --strip-components=2 -C out/ \
            $(tar -tf /tmp/talos-kernel.tar | grep -E '^dtb/broadcom/bcm27[^/]+\.dtb$')
          rm /tmp/talos-kernel.tar

          echo "Extracted device tree files:"
          ls -lah out/*.dtb

          if [ -z "$(ls out/bcm2711*.dtb 2>/dev/null)" ]; then
            echo "ERROR: No bcm2711* device tree files extracted"
            exit 1
          fi

      - name: Upload kernel device tree files
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbs
          path: out/*.dtb
          retention-days: 1
          if-no-files-found: error

  build-image:
    needs: [determine-version, build-uboot, build-optee, checkout-firmware, prepare-config, build-kernel-dtbos, extract-kernel-dtbs]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
      id-token: write

    outputs:
      image_name: ${{ steps.create_image.outputs.image_name }}
      image_size: ${{ steps.create_image.outputs.image_size }}
      release: ${{ needs.determine-version.outputs.release }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: dosfstools parted xz-utils genisoimage
          version: 1.0

      - name: Prepare build directory
        run: |
          mkdir -p build
          mkdir -p mnt
          mkdir -p out

          # Copy U-Boot as kernel8.img (default 64-bit kernel name; no config.txt kernel= entry needed)
          cp artifacts/uboot-binary/u-boot.bin build/kernel8.img

          # Copy OP-TEE armstub binaries
          cp artifacts/optee-binaries/armstub8.bin build/armstub8.bin
          cp artifacts/optee-binaries/armstub8-2712.bin build/armstub8-2712.bin

          ls -lah build/

          # Copy config file
          cp artifacts/config-files/config.txt build/

          # Copy firmware files
          cp -r artifacts/rpi-firmware/* build/

          mkdir -p build/broadcom
          cp -r artifacts/kernel-dtbs/*.dtb build/broadcom/
          cp -r artifacts/kernel-dtbs/*.dtb build/

          mkdir -p build/overlays
          cp -r artifacts/kernel-overlays/. build/overlays/
          echo "Overlay files:"
          ls -lah build/overlays/

          echo "Build directory contents:"
          ls -lah build/

      - name: Create SD card image
        id: create_image
        working-directory: out
        env:
          release: ${{ needs.determine-version.outputs.release }}
        run: |
          # Calculate required size (boot files + 100MB padding)
          BOOT_SIZE=$(du -sm ../build | cut -f1)
          IMAGE_SIZE=$((BOOT_SIZE + 100))

          echo "Creating ${IMAGE_SIZE}MB image..."

          # Create image file with semantic version
          IMAGE_NAME="uboot-rpi.img"
          dd if=/dev/zero of="$IMAGE_NAME" bs=1M count=$IMAGE_SIZE status=progress

          # Create GPT partition table with EFI System Partition for UEFI boot
          cat > partition.sfdisk << 'SFDISK_EOF'
          label: gpt
          unit: sectors
          sector-size: 512

          start=2048, type=uefi, name="EFI"
          SFDISK_EOF

          sfdisk "$IMAGE_NAME" < partition.sfdisk

          # Setup loop device
          LOOP_DEVICE=$(sudo losetup --find --show --partscan "$IMAGE_NAME")
          echo "Loop device: $LOOP_DEVICE"

          # Wait for udev to create GPT partition device nodes (avoids race condition)
          sudo udevadm settle

          # Format partition as FAT32 with explicit parameters
          sudo mkfs.vfat -F 32 -n "EFI" "${LOOP_DEVICE}p1"

          # Mount and copy files
          sudo mount "${LOOP_DEVICE}p1" ../mnt
          sudo cp -rv ../build/* ../mnt/
          sudo sync
          sudo umount ../mnt

          # Cleanup
          sudo losetup -d "$LOOP_DEVICE"

          # Calculate checksums
          sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"

          # Get image info
          IMAGE_SIZE_BYTES=$(stat -c%s "$IMAGE_NAME")
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "image_size=$IMAGE_SIZE_BYTES" >> $GITHUB_OUTPUT

          ls -lh "$IMAGE_NAME"*

      - name: Compress SD card image
        working-directory: out
        env:
          IMAGE_NAME: ${{ steps.create_image.outputs.image_name }}
        run: |
          echo "Compressing SD card image..."
          xz -9 -T 0 "${IMAGE_NAME}"
          sha256sum "${IMAGE_NAME}.xz" > "${IMAGE_NAME}.xz.sha256"

      - name: Create release notes
        working-directory: out
        env:
          release: ${{ needs.determine-version.outputs.release }}
        run: |
          cat > release_notes.md << EOF
          # Raspberry Pi 4 U-Boot SD Card Image

          ## Components

          - **U-Boot Version**: \`${{ needs.determine-version.outputs.uboot }}\`
          - **Release Version**: \`${release}\`
          - **Raspberry Pi Firmware**: \`${{ needs.determine-version.outputs.firmware }}\`
          - **Talos Kernel**: \`${{ needs.determine-version.outputs.talos_kernel }}\`
          - **Architecture**: ARM64 (aarch64)
          - **Target Device**: Raspberry Pi 4 / Raspberry Pi 400

          ## Features

          - PXE network boot support
          - DHCP client built-in
          - EFI boot support
          - USB storage boot
          - NVMe boot support (with patches)
          - Custom boot command for network-first boot
          - SMBIOS table generation (UEFI config table passed to OS)

          ## Installation

          ### Using Raspberry Pi Imager

          1. Download \`${{ steps.create_image.outputs.image_name }}.xz\`
          2. Open Raspberry Pi Imager
          3. Choose "Use custom" and select the downloaded \`.xz\` file
          4. Select your SD card
          5. Write the image

          ### Using dd (Linux/macOS)

          \`\`\`bash
          # Decompress
          xz -d ${{ steps.create_image.outputs.image_name }}.xz

          # Write to SD card (replace /dev/sdX with your SD card device)
          sudo dd if=${{ steps.create_image.outputs.image_name }} of=/dev/sdX bs=4M status=progress
          sudo sync
          \`\`\`

          ## Boot Configuration

          The image includes a custom \`config.txt\` that:
          - Enables 64-bit ARM mode
          - Uses U-Boot as the kernel
          - Configures minimal GPU memory
          - Enables UART for debugging

          ## Talos NoCloud Provisioning

          Set the SMBIOS serial number to configure Talos's NoCloud metadata server before first boot:

          \`\`\`bash
          # From a Tinkerbell workflow action after flashing the SD card
          mount /dev/mmcblk0p1 /boot
          fw_setenv -c /boot/fw_env.config serial# "ds=nocloud-net;s=http://10.10.0.1/configs/;h=HOSTNAME"
          umount /boot
          \`\`\`

          Talos reads \`/sys/class/dmi/id/product_serial\` and fetches:
          - \`http://10.10.0.1/configs/user-data\` (machine config)
          - \`http://10.10.0.1/configs/network-config\` (optional)

          ## Boot Sequence

          The default boot order:
          1. Attempt USB disk boot (EFI)
          2. Attempt network boot via DHCP/PXE
          3. Fall back to local disk

          ## Verification

          Verify the image integrity:

          \`\`\`bash
          sha256sum -c ${{ steps.create_image.outputs.image_name }}.xz.sha256
          \`\`\`

          ## Image Information

          - **Uncompressed Size**: ${{ steps.create_image.outputs.image_size }} bytes
          - **Format**: Raw disk image (MBR partition table, FAT32 boot partition)

          ---

          *Built on $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF

          cat release_notes.md

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpi4-uboot-image
          path: |
            out/${{ steps.create_image.outputs.image_name }}.xz
            out/${{ steps.create_image.outputs.image_name }}.xz.sha256
            out/release_notes.md
          retention-days: 30

      - name: Report build status
        env:
          release: ${{ needs.determine-version.outputs.release }}
        run: |
          echo "✅ U-Boot SD card image created successfully"
          echo "📦 SD Image: ${{ steps.create_image.outputs.image_name }}.xz"
          echo "📏 SD Uncompressed size: ${{ steps.create_image.outputs.image_size }} bytes"
          echo "🔖 U-Boot version: ${{ needs.determine-version.outputs.uboot }}"
          echo "🔖 Release version: ${release}"
          echo "🔖 Firmware version: ${{ needs.determine-version.outputs.firmware }}"

  publish-github-release:
    name: Publish GitHub Release
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpi4-uboot-image
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-image.outputs.release }}
          name: Release ${{ needs.build-image.outputs.release }}
          body_path: artifacts/release_notes.md
          files: |
            artifacts/${{ needs.build-image.outputs.image_name }}.xz
            artifacts/${{ needs.build-image.outputs.image_name }}.xz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
